<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MP</title>
  <meta name="description" content="MP: tus cuentas, movimientos, cripto, metas y presupuesto en un solo lugar.">
  <meta name="theme-color" content="#F3F4F6">
  <!-- Que el navegador siempre pida esta página de nuevo (así no se queda con una versión vieja). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Bodoni+Moda:ital,opsz,wght@1,6..96,800&display=swap">
  <!-- Siempre la versión más reciente: el "?t=" cambia en cada visita, así el navegador
       no usa una copia vieja del diseño o del código después de publicar una actualización. -->
  <script>window.MP_T = Date.now(); document.write('<link rel="stylesheet" href="css/styles.css?t=' + MP_T + '">');</script>
  <!-- Librería de gráficos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="is-welcome">
<!-- Pantalla de bienvenida: aparece cada vez que se abre la app (la dibuja js/app.js) -->
<div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wl-title"></div>
<div class="shell">
  <header class="top">
    <button class="icon-btn side-btn" id="side-btn" type="button" data-act="toggle-side" aria-label="Más secciones" aria-expanded="false" aria-controls="side"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="brand" type="button" data-go="inicio" aria-label="MP, ir a Inicio">MP</button>
    <nav class="rail" id="rail" aria-label="Secciones"></nav>
    <div class="top-actions">
      <label class="sr-only" for="base-sel">Ver en</label>
      <select class="mini" id="base-sel" aria-label="Moneda base">
        <option value="COP">COP</option><option value="USD">USD</option><option value="EUR">EUR</option>
      </select>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Cambiar tema"></button>
    </div>
  </header>
  <div class="side-scrim" data-act="close-side"></div>
  <aside class="side" id="side" aria-label="Más secciones"></aside>
  <main id="main"><div class="card empty"><b>Cargando tus datos…</b>Un momento.</div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
<button class="fab" id="fab" type="button" aria-label="Agregar movimiento" data-act="new-tx"><svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<!-- 1) Supabase (nube)  2) Tus datos de Supabase  3) Dónde se guardan los datos  4) La app -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
  ['js/config.js', 'js/storage.js', 'js/app.js'].forEach(function (src) {
    document.write('<script src="' + src + '?t=' + MP_T + '"><\/script>');
  });
</script>
</body>
</html>
