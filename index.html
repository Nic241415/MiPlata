<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Plata</title>
  <meta name="description" content="Mis finanzas personales: cuentas, movimientos, cripto, metas y presupuesto.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Librería de gráficos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Secciones"></nav>
  <div style="min-width:0">
    <header class="top">
      <span class="brand-m">Mi Plata</span>
      <div class="top-actions">
        <label class="small muted" for="base-sel">Ver en</label>
        <select class="mini" id="base-sel" aria-label="Moneda base">
          <option value="COP">COP</option><option value="USD">USD</option><option value="EUR">EUR</option>
        </select>
        <button class="btn sm" id="theme-btn" type="button" aria-label="Cambiar tema"></button>
      </div>
    </header>
    <main id="main"><div class="card empty"><b>Cargando tus datos…</b>Un momento.</div></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
<button class="fab" id="fab" type="button" aria-label="Agregar movimiento" data-act="new-tx"><svg class="ico" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<!-- 1) Supabase (nube)  2) Tus datos de Supabase  3) Dónde se guardan los datos  4) La app -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
